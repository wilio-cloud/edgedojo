<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="bull" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#1E293B" stroke-width="6"/>
  <line x1="72" y1="340" x2="440" y2="340" stroke="#F59E0B" stroke-width="5" stroke-dasharray="14 10" opacity="0.75"/>
  <!-- Bear candle sweep -->
  <line x1="145" y1="185" x2="145" y2="395" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>
  <rect x="121" y="220" width="48" height="125" rx="8" fill="url(#bear)"/>
  <!-- Sweep & Reclaim Pinbar -->
  <line x1="235" y1="215" x2="235" y2="425" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
  <rect x="211" y="245" width="48" height="75" rx="8" fill="url(#bull)"/>
  <!-- Impulse BOS Bull candle -->
  <line x1="325" y1="135" x2="325" y2="305" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
  <rect x="301" y="160" width="48" height="125" rx="8" fill="url(#bull)"/>
  <!-- Expansion candle -->
  <line x1="405" y1="88" x2="405" y2="210" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
  <rect x="381" y="102" width="48" height="82" rx="8" fill="url(#bull)"/>
</svg>
